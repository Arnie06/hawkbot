# .github/workflows/pr-review.yml
# SQL PR Review - Powered by Abacus AI Agent
#
# This workflow sends PR diffs to your deployed review service,
# which analyzes SQL files and posts inline comments + a summary.
#
# SETUP:
#   1. Copy this file to your repo at .github/workflows/pr-review.yml
#   2. Add these GitHub Secrets (Settings > Secrets and variables > Actions):
#      - PR_REVIEW_SERVICE_URL: Your deployed service URL (e.g. https://your-service.abacusai.app)
#      - PR_REVIEW_TOKEN: (Optional) A shared secret for webhook authentication
#   3. The workflow uses the built-in GITHUB_TOKEN for posting comments back to PRs
#
# MODES:
#   - On-demand (default): Add the label "ai-review" to a PR, or comment "/review"
#   - Automatic: Uncomment the pull_request trigger below to review every PR

name: SQL PR Review

on:
  # ── ON-DEMAND TRIGGERS (active by default) ──
  # Trigger when "ai-review" label is added
  pull_request:
    types: [labeled]

  # Trigger when someone comments "/review" on a PR
  issue_comment:
    types: [created]

  # ── AUTOMATIC TRIGGER (uncomment to enable) ──
  # pull_request:
  #   types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: SQL Style Review
    runs-on: ubuntu-latest

    # Only run if:
    #   - PR was labeled with "ai-review", OR
    #   - Someone commented "/review" on a PR
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'ai-review') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))

    steps:
      # ── Step 1: Determine PR number ──
      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      # ── Step 2: Fetch the PR diff from GitHub API ──
      - name: Fetch PR diff and changed files
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.pr.outputs.number }}
          REPO="$GITHUB_REPOSITORY"

          echo "Fetching PR #${PR_NUMBER} from ${REPO}..."

          # Get PR metadata
          PR_DATA=$(gh api repos/${REPO}/pulls/${PR_NUMBER})
          BASE_SHA=$(echo "$PR_DATA" | jq -r '.base.sha')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')

          # Get list of changed files (flatten paginated arrays into one)
          FILES_JSON=$(gh api repos/${REPO}/pulls/${PR_NUMBER}/files --paginate | jq -s 'add // []')

          # Debug: show all filenames returned by GitHub
          echo "--- All changed files in PR ---"
          echo "$FILES_JSON" | jq -r '.[].filename'
          echo "--- Total files: $(echo "$FILES_JSON" | jq 'length') ---"

          # Filter for SQL files only
          SQL_FILES=$(echo "$FILES_JSON" | jq -c '[.[] | select(.filename | test("\\.sql$"; "i"))]')
          SQL_COUNT=$(echo "$SQL_FILES" | jq 'length')

          echo "Found ${SQL_COUNT} SQL file(s) in PR"

          if [ "$SQL_COUNT" -eq "0" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No SQL files changed — skipping review."
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

          # Build the changed_files array with filename, status, and patch (diff)
          CHANGED_FILES=$(echo "$SQL_FILES" | jq -c '[.[] | {filename: .filename, status: .status, patch: .patch, contents_url: .contents_url}]')

          # For each SQL file, fetch the full file content (head version)
          FULL_PAYLOAD="[]"
          for row in $(echo "$SQL_FILES" | jq -r '.[] | @base64'); do
            FILENAME=$(echo "$row" | base64 -d | jq -r '.filename')
            STATUS=$(echo "$row" | base64 -d | jq -r '.status')
            PATCH=$(echo "$row" | base64 -d | jq -r '.patch // ""')

            # Skip deleted files
            if [ "$STATUS" = "removed" ]; then
              continue
            fi

            # Fetch file content from the head branch
            CONTENT=$(gh api repos/${REPO}/contents/${FILENAME}?ref=${HEAD_SHA} --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")

            # Build file entry
            FILE_ENTRY=$(jq -n \
              --arg filename "$FILENAME" \
              --arg status "$STATUS" \
              --arg patch "$PATCH" \
              --arg content "$CONTENT" \
              '{filename: $filename, status: $status, patch: $patch, content: $content}')

            FULL_PAYLOAD=$(echo "$FULL_PAYLOAD" | jq --argjson entry "$FILE_ENTRY" '. + [$entry]')
          done

          # Save payload to file (avoids shell escaping issues)
          echo "$FULL_PAYLOAD" > /tmp/changed_files.json
          echo "files_path=/tmp/changed_files.json" >> $GITHUB_OUTPUT

      # ── Step 3: Post "review in progress" reaction ──
      - name: React to trigger
        if: steps.fetch.outputs.skip != 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='eyes' || true

      # ── Step 4: Send to PR Review Service ──
      - name: Send to review service
        if: steps.fetch.outputs.skip != 'true'
        env:
          SERVICE_URL: ${{ secrets.PR_REVIEW_SERVICE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REVIEW_TOKEN: ${{ secrets.PR_REVIEW_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.pr.outputs.number }}
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)

          # Get HEAD SHA for inline comments
          HEAD_SHA=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq '.head.sha')

          # Build the webhook payload (snake_case to match API)
          PAYLOAD=$(jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg owner "$OWNER" \
            --arg repo "$REPO_NAME" \
            --arg github_token "$GH_TOKEN" \
            --arg commit_sha "$HEAD_SHA" \
            --slurpfile changed_files /tmp/changed_files.json \
            '{
              pr_number: $pr_number,
              owner: $owner,
              repo: $repo,
              github_token: $github_token,
              commit_sha: $commit_sha,
              changed_files: $changed_files[0]
            }')

          echo "Sending review request to ${SERVICE_URL}/webhook/pr-review ..."

          # POST to the review service
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${SERVICE_URL}/webhook/pr-review" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${PR_REVIEW_TOKEN}" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response code: ${HTTP_CODE}"
          echo "Response body: ${BODY}"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Review service returned HTTP ${HTTP_CODE}"
            exit 1
          fi

          # Parse results
          VIOLATIONS=$(echo "$BODY" | jq -r '.total_violations // 0')
          FILES=$(echo "$BODY" | jq -r '.files_reviewed // 0')
          echo "✅ Review complete: ${FILES} files reviewed, ${VIOLATIONS} violations found"

      # ── Step 5: Skip message if no SQL files ──
      - name: No SQL files found
        if: steps.fetch.outputs.skip == 'true'
        run: echo "No SQL files in this PR — nothing to review."
